<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Filter out benign browser extension injection errors (e.g. MetaMask in iframe contexts)
      (function() {
        // 0. Intercept and block third-party extension scripts from being appended to DOM
        try {
          var origAppendChild = Node.prototype.appendChild;
          Node.prototype.appendChild = function(child) {
            if (child && child.nodeName === 'SCRIPT' && child.src && child.src.indexOf('chrome-extension://') !== -1) {
              return child;
            }
            return origAppendChild.apply(this, arguments);
          };

          var origInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, referenceNode) {
            if (newNode && newNode.nodeName === 'SCRIPT' && newNode.src && newNode.src.indexOf('chrome-extension://') !== -1) {
              return newNode;
            }
            return origInsertBefore.apply(this, arguments);
          };
        } catch (e) {}

        // Mock a safe ethereum provider with a resolving connect() method so any caller never throws
        try {
          var noop = function() {};
          var safeEth = {
            isMetaMask: true,
            isConnected: function() { return true; },
            chainId: '0x1',
            networkVersion: '1',
            selectedAddress: null,
            request: function() { return Promise.resolve([]); },
            send: function(p, cb) { if (cb) cb(null, { result: [] }); },
            sendAsync: function(p, cb) { if (cb) cb(null, { result: [] }); },
            on: noop,
            removeListener: noop,
            connect: function() { return Promise.resolve(); }
          };
          window.ethereum = safeEth;
        } catch (e) {}

        function isExtensionError(msg, stack, source) {
          var str = ((msg || '') + ' ' + (stack || '') + ' ' + (source || '')).toLowerCase();
          return str.indexOf('metamask') !== -1 ||
                 str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
                 str.indexOf('inpage.js') !== -1 ||
                 str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 str.indexOf('failed to connect') !== -1 ||
                 str.indexOf('ethereum') !== -1;
        }

        // Mock stream responder so MetaMask inpage.js handshake succeeds peacefully without throwing
        try {
          window.addEventListener('message', function(ev) {
            try {
              if (ev && ev.data && ev.data.target === 'metamask-contentscript') {
                window.postMessage({
                  target: 'metamask-inpage',
                  data: { name: 'metamask-provider', data: { isUnlocked: false } }
                }, '*');
              }
            } catch (err) {}
          }, false);
        } catch (err) {}

        // 1. Intercept console.error to prevent external browser extension logs from leaking to preview harnesses
        var origConsoleError = console.error;
        console.error = function() {
          var combined = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              combined += ' ' + (arg.stack || arg.message || String(arg));
            }
          }
          if (isExtensionError(combined, '', '')) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Intercept console.warn
        var origConsoleWarn = console.warn;
        console.warn = function() {
          var combined = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              combined += ' ' + (arg.stack || arg.message || String(arg));
            }
          }
          if (isExtensionError(combined, '', '')) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 3. Intercept window.onerror
        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var stack = (error && error.stack) || '';
          if (isExtensionError(msg, stack, url)) {
            return true;
          }
          if (origOnError) {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        // 4. Intercept window.onunhandledrejection
        var origOnUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function(event) {
          var reason = (event && event.reason) || {};
          var msg = reason.message || String(reason || '');
          var stack = reason.stack || '';
          if (isExtensionError(msg, stack, '')) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
          }
          if (origOnUnhandledRejection) {
            return origOnUnhandledRejection.apply(this, arguments);
          }
        };

        // 5. DOM Event listeners for error & unhandledrejection in capture phase
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var stack = (event.error && event.error.stack) || '';
          var filename = event.filename || '';
          if (isExtensionError(msg, stack, filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason || {};
          var msg = reason.message || String(reason || '');
          var stack = reason.stack || '';
          if (isExtensionError(msg, stack, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
