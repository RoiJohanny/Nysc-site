<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nyscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="100%" stop-color="#005a36" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#nyscGrad)" />
  
  <!-- Outer Gold Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <path d="M 256 100 Q 340 100 370 170 Q 370 290 256 380 Q 142 290 142 170 Q 172 100 256 100 Z" fill="#ffffff" />
    <path d="M 256 116 Q 328 116 354 176 Q 354 280 256 360 Q 158 280 158 176 Q 184 116 256 116 Z" fill="#008751" />
  </g>

  <!-- Laurel & Torch Emblem / Typography -->
  <text x="256" y="240" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#ffffff" text-anchor="middle" letter-spacing="4">NYSC</text>
  <text x="256" y="280" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#f59e0b" text-anchor="middle" letter-spacing="2">COMPANION</text>

  <!-- Nigerian Flag Stanza Stripes -->
  <rect x="216" y="304" width="24" height="12" rx="3" fill="#008751" />
  <rect x="244" y="304" width="24" height="12" rx="3" fill="#ffffff" />
  <rect x="272" y="304" width="24" height="12" rx="3" fill="#008751" />
</svg>
